version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor:
        update-types: [minor, patch]

  # Keeps the SHA pins in .github/workflows current. Dependabot rewrites the
  # pinned commit and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /share-server
    schedule:
      interval: weekly
    groups:
      share-server:
        patterns: ["*"]
