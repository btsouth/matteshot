name: Verify release credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-r2:
    name: Cloudflare R2
    runs-on: [self-hosted, windows, matteshot]
    environment: release
    steps:
      - name: Verify access to the release bucket
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) {
            Write-Error "CLOUDFLARE_R2_API_TOKEN is not configured."
            exit 1
          }

          $headers = @{
            Authorization = "Bearer $env:CLOUDFLARE_API_TOKEN"
          }

          $verifyUri = "https://api.cloudflare.com/client/v4/accounts/$env:CLOUDFLARE_ACCOUNT_ID/tokens/verify"
          $token = Invoke-RestMethod -Method Get -Uri $verifyUri -Headers $headers
          if (-not $token.success -or $token.result.status -ne "active") {
            Write-Error "The Cloudflare account token is not active."
            exit 1
          }
          Write-Host "Cloudflare account token is active."

          $download = Join-Path $env:RUNNER_TEMP "MatteshotSetup.exe"
          npx --yes wrangler@latest r2 object get "matteshot-downloads/MatteshotSetup.exe" `
            --file $download `
            --remote
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Wrangler could not read from the release bucket."
            exit $LASTEXITCODE
          }
          if (-not (Test-Path $download) -or (Get-Item $download).Length -eq 0) {
            Write-Error "Wrangler returned an empty installer."
            exit 1
          }

          Write-Host "Cloudflare credentials work through the Wrangler release path."

  cloudflare-cache-purge:
    name: Cloudflare cache purge
    runs-on: [self-hosted, windows, matteshot]
    environment: release
    steps:
      - name: Verify access to purge the stable download
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) {
            Write-Error "CLOUDFLARE_CACHE_PURGE_API_TOKEN is not configured."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ZONE_ID)) {
            Write-Error "CLOUDFLARE_ZONE_ID is not configured."
            exit 1
          }

          $headers = @{
            Authorization = "Bearer $env:CLOUDFLARE_API_TOKEN"
          }
          try {
            $token = Invoke-RestMethod -Method Get `
              -Uri "https://api.cloudflare.com/client/v4/user/tokens/verify" `
              -Headers $headers
          } catch {
            $detail = $_.ErrorDetails.Message
            if (-not $detail) { $detail = $_.Exception.Message }
            Write-Error "Cloudflare token verification failed: $detail"
            exit 1
          }
          if (-not $token.success -or $token.result.status -ne "active") {
            Write-Error "The Cloudflare cache purge token is not active."
            exit 1
          }
          Write-Host "Cloudflare cache purge token is active."

          $body = @{ files = @(
            "https://download.matteshot.app/MatteshotSetup.exe",
            "https://download.matteshot.app/MatteshotSetup.exe.sha256"
          ) } | ConvertTo-Json
          try {
            $purge = Invoke-RestMethod -Method Post `
              -Uri "https://api.cloudflare.com/client/v4/zones/$env:CLOUDFLARE_ZONE_ID/purge_cache" `
              -Headers $headers -ContentType "application/json" -Body $body
          } catch {
            $detail = $_.ErrorDetails.Message
            if (-not $detail) { $detail = $_.Exception.Message }
            Write-Error "Cloudflare cache purge failed: $detail"
            exit 1
          }
          if (-not $purge.success) {
            Write-Error "Cloudflare rejected the cache purge: $($purge.errors | ConvertTo-Json -Compress)"
            exit 1
          }
          Write-Host "Cloudflare accepted a purge for the stable installer and checksum."
