name: Verify release credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-r2:
    name: Cloudflare R2
    runs-on: windows-latest
    environment: release
    steps:
      - name: Verify access to the release bucket
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) {
            Write-Error "CLOUDFLARE_R2_API_TOKEN is not configured."
            exit 1
          }

          $headers = @{
            Authorization = "Bearer $env:CLOUDFLARE_API_TOKEN"
          }
          $uri = "https://api.cloudflare.com/client/v4/accounts/$env:CLOUDFLARE_ACCOUNT_ID/r2/buckets/matteshot-downloads/objects?per_page=1"
          $response = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers

          if (-not $response.success) {
            Write-Error "Cloudflare rejected the release credentials."
            exit 1
          }

          Write-Host "Cloudflare credentials can read the matteshot-downloads bucket."
