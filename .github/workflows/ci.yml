name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint and build
    runs-on: [self-hosted, windows, matteshot]
    # Self-hosted runners execute PR code on this host, not an ephemeral one;
    # a fork PR would otherwise get arbitrary code execution here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Validate release version sources
        shell: pwsh
        run: |
          $cargo = Get-Content -Raw Cargo.toml
          $version = [regex]::Match(
            $cargo,
            '(?ms)^\[package\]\s*.*?^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          .\scripts\validate-release-version.ps1 -Tag "v$version"

      - name: Verify code
        shell: pwsh
        run: .\scripts\verify-code.ps1
