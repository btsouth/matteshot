name: CI

# Both triggers, deliberately. Dropping the main run looked like a saving and
# was the opposite: Actions caches restore from the current branch or the
# default branch, so with nothing ever running on main there is no shared
# cache and every pull request starts cold. Two warm runs cost less than one
# cold one.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint and build
    runs-on: windows-latest
    # A ceiling, not a target: cold-cache runs build and test both the default
    # and the share build. Without one, a hung job runs to GitHub's six-hour
    # default.
    timeout-minutes: 40
    # Runs for every pull request, forks included. That is safe because
    # nothing here holds anything worth taking: the token is read-only, the
    # job uses no secrets or environment, and the GitHub-hosted runner is
    # discarded afterwards. Signing and publishing live only in release.yml
    # and release-candidate.yml, behind the `release` environment, which pull
    # requests cannot reach. A first-time outside contributor's run waits for
    # a maintainer's approval (repository setting).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Branch code runs in this job; leave no GITHUB_TOKEN behind in
          # .git/config for it to read.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `cargo install cargo-audit --locked` builds the auditor from source,
      # which measured at 12.5 of this job's 19.3 minutes - two thirds of the
      # run, for a binary that only changes when the pin does. rust-cache
      # covers target/ and the registry, not ~/.cargo/bin, so it needs its own
      # entry. The key is read out of the pin itself rather than written here,
      # so bumping the pin invalidates the cache instead of serving the old
      # binary to a check whose whole job is refusing the wrong version.
      - name: Read the pinned cargo-audit version
        id: audit-pin
        shell: pwsh
        run: |
          $pin = [regex]::Match(
            (Get-Content -Raw scripts/audit-rust.ps1),
            "(?ms)function Get-CargoAuditPin\s*\{.*?return\s*'([^']+)'"
          ).Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($pin)) {
            throw 'could not read the cargo-audit pin from scripts/audit-rust.ps1'
          }
          "version=$pin" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: cargo-audit-${{ runner.os }}-${{ steps.audit-pin.outputs.version }}

      - name: Check workflow dependency pins
        shell: pwsh
        run: .\scripts\check-workflow-pins.ps1

      - name: Validate release version sources
        shell: pwsh
        run: |
          $cargo = Get-Content -Raw Cargo.toml
          $version = [regex]::Match(
            $cargo,
            '(?ms)^\[package\]\s*.*?^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          .\scripts\validate-release-version.ps1 -Tag "v$version"

      - name: Verify code
        shell: pwsh
        run: .\scripts\verify-code.ps1

  policy:
    name: Format and dependency policy
    # Platform independent, so it runs on Linux: formatting, and cargo-deny's
    # license, source and advisory rules from deny.toml.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check licenses, sources and advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  share-server:
    name: Share server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: share-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: share-server/package-lock.json

      - name: Install
        run: npm ci --no-fund

      - name: Check syntax
        run: npm run check

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
