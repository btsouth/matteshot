name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint and build
    runs-on: [self-hosted, windows, matteshot]
    # Self-hosted runners execute PR code on this host, not an ephemeral one,
    # and the same machine later runs the signing workflows. Nobody but the
    # owner's own same-repository branches may schedule it: a fork PR would be
    # arbitrary code execution outright, and a collaborator branch could plant
    # persistence that waits for the next release run. (Truly ephemeral PR
    # runners need hosted minutes this repo ran out of; this gate is the
    # boundary until then.)
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner &&
       github.actor == github.repository_owner)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check workflow dependency pins
        shell: pwsh
        run: .\scripts\check-workflow-pins.ps1

      - name: Validate release version sources
        shell: pwsh
        run: |
          $cargo = Get-Content -Raw Cargo.toml
          $version = [regex]::Match(
            $cargo,
            '(?ms)^\[package\]\s*.*?^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          .\scripts\validate-release-version.ps1 -Tag "v$version"

      - name: Verify code
        shell: pwsh
        run: .\scripts\verify-code.ps1
