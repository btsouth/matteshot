name: CI

# Pull requests only. main is protected and squash-merged from a branch that
# had to be up to date, so the tree main lands on is the tree this workflow
# already passed on the PR. Re-running it after the merge bought a second
# answer to the same question, and on a private repo that answer is billed at
# the Windows rate.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint and build
    runs-on: windows-latest
    # A ceiling, not a target: observed cold-cache runs are around 20 minutes.
    # Without one, a hung job bills against GitHub's six-hour default.
    timeout-minutes: 25
    # The original reason for this gate is gone: runners are hosted and
    # ephemeral now, so PR code no longer executes on the machine that signs
    # releases. What it still does is keep a branch nobody vetted from
    # spending billed minutes, which is why it stays. The push arm went with
    # the push trigger.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job executes branch code on a persistent host; leave no
          # GITHUB_TOKEN behind in .git/config for that code to read.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check workflow dependency pins
        shell: pwsh
        run: .\scripts\check-workflow-pins.ps1

      - name: Validate release version sources
        shell: pwsh
        run: |
          $cargo = Get-Content -Raw Cargo.toml
          $version = [regex]::Match(
            $cargo,
            '(?ms)^\[package\]\s*.*?^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          .\scripts\validate-release-version.ps1 -Tag "v$version"

      - name: Verify code
        shell: pwsh
        run: .\scripts\verify-code.ps1
