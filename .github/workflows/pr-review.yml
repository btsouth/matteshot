# CodeRev shadow review.
#
# Runs alongside CodeRabbit rather than replacing it. CodeRev's benchmark
# The Grok subscription canary changes generation only. DeepSeek keeps judging
# the panel so generator quality can be measured independently before the
# riskier panel swap. Keep rates and wall time come from run logs; do not scale
# this workflow until they hold at 30-50% and under roughly five minutes.
#
# Advisory (continue-on-error): a red X on a model's opinion trains people to
# ignore the check.
name: PR review

on:
  pull_request:
    # one-review-per-PR: synchronize removed 2026-08-08 — a review on
    # every push had agents in an endless fix-review loop. Reviews now
    # fire once when the PR opens and again if it is marked ready.
    types: [opened, ready_for_review, labeled]

# A second push reviews the new head, not race the old one.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: CodeRev (advisory)
    # Self-hosted since the hosted-minutes pool ran out (2026-08). Reviews are
    # ~99% waiting on model APIs, so the local CPU cost is nil; they do share
    # the single runner with ci.yml and will queue behind builds.
    runs-on: [self-hosted, windows, matteshot, grok]
    continue-on-error: true
    timeout-minutes: 20
    # Fork PRs do not get repository secrets, and Dependabot-triggered runs get
    # the Dependabot secret store rather than the repository one, so in both
    # cases the model call would fail with a confusing auth error rather than
    # an obvious skip. Drafts are declared-unfinished work; the
    # ready_for_review trigger picks the PR up the moment that changes.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Tracks main during the shadow phase so reviewer fixes land without a
      # release step. Pin to a tag once the shadow comparison earns it.
      - name: Review
        uses: tsouth89/coderev@main
        with:
          provider: exec
          model: grok-subscription
          exec-command: grok
          # Muse keeps the measured two-model recall diversity.
          find2-provider: meta
          find2-model: muse-spark-1.2-contributor
          find2-api-key: ${{ secrets.REVIEW_FIND2_API_KEY }}
          # Phase one isolates Grok generation quality; DeepSeek remains the panel.
          refute-provider: deepseek
          refute-api-key: ${{ secrets.REVIEW_API_KEY }}
