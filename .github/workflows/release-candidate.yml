name: Release candidate

# Dispatch-only. This workflow signs with the production Trusted Signing
# identity, so pull requests must never schedule it: a PR trigger meant any
# same-repository branch could run its own build.rs on the persistent signing
# runner with the release environment and OIDC attached, and walk away with a
# production-signed artifact before review. Candidates are cut manually from
# commits already merged to main; the ancestry gate below enforces that.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build, test and sign on the free self-hosted runner. Only the desktop
  # probes in the job below need a real GitHub-hosted VM, so everything that
  # doesn't is kept off billed minutes.
  build:
    name: Build and sign private candidate
    runs-on: [self-hosted, windows, matteshot]
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.package.outputs.version }}
      installer-name: ${{ steps.installer.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the ancestry gate below can walk back to main.
          fetch-depth: 0

      # workflow_dispatch runs whatever ref it was pointed at, and an admin can
      # point it at any branch. Only commits that already survived review and
      # merged to protected main may reach the signing identity.
      - name: Require a commit reachable from main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Commit $env:GITHUB_SHA is not reachable from origin/main. Candidates are signed only from merged commits."
            exit 1
          }

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object name -eq 'matteshot' | Select-Object -First 1
          if (-not $package) {
            Write-Error 'Matteshot package metadata was not found.'
            exit 1
          }
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Verify code
        shell: pwsh
        run: .\scripts\verify-code.ps1

      # GitHub-hosted images ship the Azure CLI preinstalled; this self-hosted
      # one does not. The runner service's own process PATH predates any
      # install, so a fresh choco install is invisible to later steps unless
      # its directory is added to GITHUB_PATH explicitly.
      - name: Install Azure CLI
        shell: pwsh
        run: |
          if (-not (Get-Command az -ErrorAction SilentlyContinue)) {
            choco install azure-cli -y --no-progress
          }
          $azDir = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin"
          if (Test-Path $azDir) {
            $azDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Sign in to Azure with GitHub OIDC
        uses: Azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the app binary with Trusted Signing
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\target\release\matteshot.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ISCC signs the setup executable and the generated uninstaller through
      # scripts\sign-file.ps1. The uninstaller can only be signed here: it
      # exists solely inside the compiler, and shipping it unsigned meant
      # SmartScreen warnings at uninstall despite a trusted install.
      - name: Build and sign installer
        id: installer
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          # Pinned to match release.yml: the ISCC path below is version
          # specific, and a candidate built on a different compiler than the
          # real release is not much of a rehearsal.
          choco install innosetup --version=6.7.1 -y --no-progress
          $version = '${{ steps.package.outputs.version }}'
          $signScript = (Resolve-Path 'scripts\sign-file.ps1').Path
          $signCommand = "pwsh -NoProfile -ExecutionPolicy Bypass -File `"$signScript`" `$f"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$version /DSign "/Ssigntool=$signCommand" installer\matteshot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $path = "installer\Output\MatteshotSetup-$version.exe"
          if (-not (Test-Path $path)) {
            Write-Error "Installer not found at $path."
            exit 1
          }
          "path=$((Resolve-Path $path).Path)" >> $env:GITHUB_OUTPUT
          # A job output the probe job below can use directly, rather than
          # every downstream step reconstructing this filename from the
          # version string and silently going stale if the naming changes.
          "name=$(Split-Path -Leaf $path)" >> $env:GITHUB_OUTPUT

      - name: Verify signatures and checksum
        shell: pwsh
        run: |
          # Assert the exact signer, not just generic validity: the installed
          # app's own updater gate (src/installer.rs) accepts only this
          # identity, so a merely-Valid signature from a drifted profile would
          # pass Windows and still brick auto-update for every client.
          foreach ($file in @(
            '${{ github.workspace }}\target\release\matteshot.exe',
            '${{ steps.installer.outputs.path }}'
          )) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid') {
              Write-Error "Signature on $file is $($sig.Status)."
              exit 1
            }
            $signer = $sig.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($signer -cne 'Brandon South') {
              Write-Error "Unexpected signer on ${file}: '$signer' ($($sig.SignerCertificate.Subject))"
              exit 1
            }
          }
          $hash = (Get-FileHash -Algorithm SHA256 '${{ steps.installer.outputs.path }}').Hash.ToLowerInvariant()
          # Written next to the installer (workspace-relative), not RUNNER_TEMP,
          # so it travels with the installer into the artifact below and is
          # still there once the probe job downloads it on a different machine.
          "$hash  MatteshotSetup-${{ steps.package.outputs.version }}.exe" |
            Set-Content -Encoding ascii -NoNewline 'installer\Output\MatteshotSetup.exe.sha256'

      # Handed to the probe job below, which needs a real GitHub-hosted desktop
      # session the self-hosted runner cannot provide.
      - name: Upload unverified candidate for probing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-unverified-${{ steps.package.outputs.version }}
          path: |
            target\release\matteshot.exe
            installer\Output\${{ steps.installer.outputs.name }}
            installer\Output\MatteshotSetup.exe.sha256
          if-no-files-found: error
          retention-days: 1

  # A real interactive desktop session is the one thing a Windows *service*
  # (what the self-hosted runner is) fundamentally cannot provide, no matter
  # which account it runs as — Session 0 has no desktop to record. This job
  # exists only for the two steps that need one, so billed time here is a
  # couple of minutes rather than the ~10 the whole candidate used to take.
  probe:
    name: Probe the signed candidate
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download unverified candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-unverified-${{ needs.build.outputs.version }}

      # The build job already checked these once, but that was on a different
      # machine: re-check after the artifact hop rather than trusting that a
      # truncated download, storage corruption, or tampering in between would
      # have been caught some other way.
      - name: Re-verify signature and hash after transfer
        shell: pwsh
        run: |
          $installerPath = "installer\Output\${{ needs.build.outputs.installer-name }}"
          foreach ($file in @('target\release\matteshot.exe', $installerPath)) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid') {
              Write-Error "Signature on $file is $($sig.Status) after transfer."
              exit 1
            }
            $signer = $sig.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($signer -cne 'Brandon South') {
              Write-Error "Unexpected signer on ${file}: '$signer' ($($sig.SignerCertificate.Subject))"
              exit 1
            }
          }
          $expected = ((Get-Content -Raw 'installer\Output\MatteshotSetup.exe.sha256') -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $installerPath).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            Write-Error "Installer hash changed after transfer. Expected $expected, got $actual."
            exit 1
          }

      # The video probes need something to decode. Record it here rather than
      # committing a fixture: the recording and encode path gets exercised as a
      # side effect, and the runner can do this even though it cannot offer a
      # window to capture.
      - name: Record a video fixture
        shell: pwsh
        run: |
          & '${{ github.workspace }}\target\release\matteshot.exe' --record-test 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probe the signed candidate
        shell: pwsh
        # -Offline on purpose: the network probes check the *published* release,
        # so leaving them in would fail this candidate whenever production is
        # having a bad day. -NoCapture because a GitHub-hosted runner has no
        # visible window for --bench and --ocr to find. -Strict because a probe
        # that silently did not run is what let a broken --video-edit-test ship
        # for weeks.
        run: |
          .\scripts\run-probes.ps1 `
            -Strict `
            -Offline `
            -NoCapture `
            -Exe '${{ github.workspace }}\target\release\matteshot.exe' `
            -SignedFile '${{ github.workspace }}\installer\Output\${{ needs.build.outputs.installer-name }}'

      - name: Upload private signed candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Matteshot-${{ needs.build.outputs.version }}-signed-candidate
          path: |
            installer\Output\${{ needs.build.outputs.installer-name }}
            installer\Output\MatteshotSetup.exe.sha256
          if-no-files-found: error
          retention-days: 14
