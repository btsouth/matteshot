name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and release
    runs-on: windows-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Validate release version
        id: release
        shell: pwsh
        run: .\scripts\validate-release-version.ps1 -Tag '${{ github.ref_name }}'

      - name: Require release credentials
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) {
            Write-Error "CLOUDFLARE_R2_API_TOKEN is required for releases."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            Write-Error "CLOUDFLARE_ACCOUNT_ID is required for releases."
            exit 1
          }
          $headers = @{
            Authorization = "Bearer $env:CLOUDFLARE_API_TOKEN"
          }
          $uri = "https://api.cloudflare.com/client/v4/accounts/$env:CLOUDFLARE_ACCOUNT_ID/tokens/verify"
          $token = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          if (-not $token.success -or $token.result.status -ne "active") {
            Write-Error "The Cloudflare release token is not active."
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Sign the app exe first so the installer packages a signed binary.
      - name: Sign the app binary with Trusted Signing
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\target\release\matteshot.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build the installer
        id: installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = '${{ steps.release.outputs.version }}'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$version installer\matteshot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $path = "installer\Output\MatteshotSetup-$version.exe"
          if (-not (Test-Path $path)) { Write-Error "installer not found at $path"; exit 1 }
          # The signing action requires rooted paths.
          "path=$((Resolve-Path $path).Path)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Sign the installer with Trusted Signing
        uses: Azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ steps.installer.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature '${{ steps.installer.outputs.path }}'
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { Write-Error "signature is $($sig.Status)"; exit 1 }

      - name: Generate SHA-256 checksums
        id: checksums
        shell: pwsh
        run: |
          $version = '${{ steps.installer.outputs.version }}'
          $path = '${{ steps.installer.outputs.path }}'
          $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          $versioned = Join-Path $env:RUNNER_TEMP "MatteshotSetup-$version.exe.sha256"
          $stable = Join-Path $env:RUNNER_TEMP "MatteshotSetup.exe.sha256"
          "$hash  MatteshotSetup-$version.exe" | Set-Content -Encoding ascii -NoNewline $versioned
          "$hash  MatteshotSetup.exe" | Set-Content -Encoding ascii -NoNewline $stable
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "versioned=$versioned" >> $env:GITHUB_OUTPUT
          "stable=$stable" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256: $hash"

      - name: Publish the installer to Cloudflare R2
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $v = '${{ steps.installer.outputs.version }}'
          $p = '${{ steps.installer.outputs.path }}'
          npx --yes wrangler@4 r2 object put "matteshot-downloads/MatteshotSetup-$v.exe" `
            --file $p --content-type application/octet-stream --remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes wrangler@4 r2 object put "matteshot-downloads/MatteshotSetup.exe" `
            --file $p --content-type application/octet-stream --remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes wrangler@4 r2 object put "matteshot-downloads/MatteshotSetup-$v.exe.sha256" `
            --file '${{ steps.checksums.outputs.versioned }}' --content-type text/plain --remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes wrangler@4 r2 object put "matteshot-downloads/MatteshotSetup.exe.sha256" `
            --file '${{ steps.checksums.outputs.stable }}' --content-type text/plain --remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify published installers
        shell: pwsh
        run: |
          $v = '${{ steps.installer.outputs.version }}'
          $expected = '${{ steps.checksums.outputs.hash }}'
          $versioned = Join-Path $env:RUNNER_TEMP "verify-MatteshotSetup-$v.exe"
          $stable = Join-Path $env:RUNNER_TEMP "verify-MatteshotSetup.exe"
          $nonce = [guid]::NewGuid().ToString("N")

          Invoke-WebRequest `
            -Uri "https://download.matteshot.app/MatteshotSetup-$v.exe?verify=$nonce" `
            -Headers @{ "Cache-Control" = "no-cache"; Pragma = "no-cache" } `
            -OutFile $versioned
          Invoke-WebRequest `
            -Uri "https://download.matteshot.app/MatteshotSetup.exe?verify=$nonce" `
            -Headers @{ "Cache-Control" = "no-cache"; Pragma = "no-cache" } `
            -OutFile $stable

          foreach ($path in @($versioned, $stable)) {
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              Write-Error "Published download verification failed for $path. Expected $expected, got $actual."
              exit 1
            }
          }
          Write-Host "Versioned and stable public installers match SHA-256 $expected."

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.installer.outputs.version }}'
          $hash = '${{ steps.checksums.outputs.hash }}'
          $notes = "Signed Windows installer.`n`nSHA-256: $hash"
          gh release create "v$version" `
            '${{ steps.installer.outputs.path }}' `
            '${{ steps.checksums.outputs.versioned }}' `
            --title "Matteshot $version" `
            --notes $notes `
            --verify-tag
