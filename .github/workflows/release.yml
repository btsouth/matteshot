name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Build and sign on the self-hosted runner, but do not publish yet: the
  # strict probe suite needs a GitHub-hosted desktop session (the probe job
  # below), and nothing may reach R2 until the exact artifact has passed the
  # same signer-identity gate every installed client enforces.
  build:
    name: Build and sign
    runs-on: [self-hosted, windows, matteshot]
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.installer.outputs.version }}
      installer-name: ${{ steps.installer.outputs.name }}
      hash: ${{ steps.verify.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the ancestry gate below can walk back to main.
          fetch-depth: 0

      # A tag can be pushed onto any commit. Only commits that already merged
      # to protected main may be built and signed as a release.
      - name: Require a tag on a commit reachable from main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tag ${{ github.ref_name }} points at $env:GITHUB_SHA, which is not reachable from origin/main."
            exit 1
          }

      - name: Validate release version
        id: release
        shell: pwsh
        run: .\scripts\validate-release-version.ps1 -Tag '${{ github.ref_name }}'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify code
        shell: pwsh
        run: .\scripts\verify-code.ps1

      # GitHub-hosted images ship the Azure CLI preinstalled; this self-hosted
      # one does not. The runner service's own process PATH predates any
      # install, so a fresh choco install is invisible to later steps unless
      # its directory is added to GITHUB_PATH explicitly.
      - name: Install Azure CLI
        shell: pwsh
        run: |
          if (-not (Get-Command az -ErrorAction SilentlyContinue)) {
            choco install azure-cli -y --no-progress
          }
          $azDir = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin"
          if (Test-Path $azDir) {
            $azDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Sign in to Azure with GitHub OIDC
        uses: Azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Sign the app exe first so the installer packages a signed binary.
      - name: Sign the app binary with Trusted Signing
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\target\release\matteshot.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ISCC signs the setup executable and the generated uninstaller through
      # scripts\sign-file.ps1. The uninstaller can only be signed here: it
      # exists solely inside the compiler, and shipping it unsigned meant
      # SmartScreen warnings at uninstall despite a trusted install.
      - name: Build and sign the installer
        id: installer
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          # Pinned: the ISCC path below is version-specific, and Inno Setup 7
          # is already out upstream. An unpinned install breaks this step the
          # day the Chocolatey package moves to it, after the app binary has
          # been signed but before anything is published. 6.7.1 is the newest
          # the Chocolatey feed carries.
          choco install innosetup --version=6.7.1 -y --no-progress
          $version = '${{ steps.release.outputs.version }}'
          $signScript = (Resolve-Path 'scripts\sign-file.ps1').Path
          $signCommand = "pwsh -NoProfile -ExecutionPolicy Bypass -File `"$signScript`" `$f"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$version /DSign "/Ssigntool=$signCommand" installer\matteshot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $path = "installer\Output\MatteshotSetup-$version.exe"
          if (-not (Test-Path $path)) { Write-Error "installer not found at $path"; exit 1 }
          "path=$((Resolve-Path $path).Path)" >> $env:GITHUB_OUTPUT
          "name=$(Split-Path -Leaf $path)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify signatures and checksum
        id: verify
        shell: pwsh
        run: |
          # Assert the exact signer, not just generic validity: the installed
          # app's own updater gate (src/installer.rs) accepts only this
          # identity, so a merely-Valid signature from a drifted profile would
          # pass Windows and still brick auto-update for every client.
          foreach ($file in @(
            '${{ github.workspace }}\target\release\matteshot.exe',
            '${{ steps.installer.outputs.path }}'
          )) {
            $sig = Get-AuthenticodeSignature $file
            $sig | Format-List Status, StatusMessage, SignerCertificate
            if ($sig.Status -ne 'Valid') {
              Write-Error "Signature on $file is $($sig.Status)."
              exit 1
            }
            if ($sig.SignerCertificate.Subject -notmatch 'CN=Brandon South') {
              Write-Error "Unexpected signer on ${file}: $($sig.SignerCertificate.Subject)"
              exit 1
            }
          }
          $hash = (Get-FileHash -Algorithm SHA256 '${{ steps.installer.outputs.path }}').Hash.ToLowerInvariant()
          "hash=$hash" >> $env:GITHUB_OUTPUT
          # Travels inside the artifact so the probe and publish jobs verify
          # the exact bytes this job hashed, on their own machines.
          "$hash  MatteshotSetup-${{ steps.installer.outputs.version }}.exe" |
            Set-Content -Encoding ascii -NoNewline 'installer\Output\MatteshotSetup.exe.sha256'
          Write-Host "SHA-256: $hash"

      - name: Upload unverified release for probing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-unverified-${{ steps.installer.outputs.version }}
          path: |
            target\release\matteshot.exe
            installer\Output\${{ steps.installer.outputs.name }}
            installer\Output\MatteshotSetup.exe.sha256
          if-no-files-found: error
          retention-days: 1

  # The strict probe suite includes the updater's own --verify-signature-test
  # gate (accept ours, reject tampered, reject foreign), run against the exact
  # tagged artifact. It needs a GitHub-hosted desktop session: the self-hosted
  # runner is a Session 0 service with no desktop for --record-test to encode
  # from. Releases are rare enough that the couple of billed minutes is cheap
  # against publishing an installer every installed client would reject.
  probe:
    name: Probe the tagged release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download unverified release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-unverified-${{ needs.build.outputs.version }}

      - name: Re-verify signature and hash after transfer
        shell: pwsh
        run: |
          $installerPath = "installer\Output\${{ needs.build.outputs.installer-name }}"
          foreach ($file in @('target\release\matteshot.exe', $installerPath)) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid') {
              Write-Error "Signature on $file is $($sig.Status) after transfer."
              exit 1
            }
            if ($sig.SignerCertificate.Subject -notmatch 'CN=Brandon South') {
              Write-Error "Unexpected signer on ${file}: $($sig.SignerCertificate.Subject)"
              exit 1
            }
          }
          $actual = (Get-FileHash -Algorithm SHA256 $installerPath).Hash.ToLowerInvariant()
          if ($actual -ne '${{ needs.build.outputs.hash }}') {
            Write-Error "Installer hash changed after transfer. Expected ${{ needs.build.outputs.hash }}, got $actual."
            exit 1
          }

      - name: Record a video fixture
        shell: pwsh
        run: |
          & '${{ github.workspace }}\target\release\matteshot.exe' --record-test 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probe the tagged release
        shell: pwsh
        # -Offline: the network probes check the *published* release, which
        # this run has deliberately not published yet. -NoCapture because a
        # GitHub-hosted runner has no visible window. -Strict so a probe that
        # silently did not run fails the release instead of shipping.
        run: |
          .\scripts\run-probes.ps1 `
            -Strict `
            -Offline `
            -NoCapture `
            -Exe '${{ github.workspace }}\target\release\matteshot.exe' `
            -SignedFile '${{ github.workspace }}\installer\Output\${{ needs.build.outputs.installer-name }}'

  # Publishes only after the probe job passed, and only bytes whose SHA-256
  # matches what the build job hashed and the probe job tested.
  publish:
    name: Publish
    needs: [build, probe]
    runs-on: [self-hosted, windows, matteshot]
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Require release credentials
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) {
            Write-Error "CLOUDFLARE_R2_API_TOKEN is required for releases."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            Write-Error "CLOUDFLARE_ACCOUNT_ID is required for releases."
            exit 1
          }
          $headers = @{
            Authorization = "Bearer $env:CLOUDFLARE_API_TOKEN"
          }
          $uri = "https://api.cloudflare.com/client/v4/accounts/$env:CLOUDFLARE_ACCOUNT_ID/tokens/verify"
          $token = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          if (-not $token.success -or $token.result.status -ne "active") {
            Write-Error "The Cloudflare release token is not active."
            exit 1
          }

      - name: Download probed release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-unverified-${{ needs.build.outputs.version }}

      - name: Verify the probed bytes and stage checksums
        id: checksums
        shell: pwsh
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $expected = '${{ needs.build.outputs.hash }}'
          $path = (Resolve-Path "installer\Output\${{ needs.build.outputs.installer-name }}").Path
          $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            Write-Error "Installer hash changed between probing and publication. Expected $expected, got $actual."
            exit 1
          }
          $versioned = Join-Path $env:RUNNER_TEMP "MatteshotSetup-$version.exe.sha256"
          $stable = Join-Path $env:RUNNER_TEMP "MatteshotSetup.exe.sha256"
          "$expected  MatteshotSetup-$version.exe" | Set-Content -Encoding ascii -NoNewline $versioned
          "$expected  MatteshotSetup.exe" | Set-Content -Encoding ascii -NoNewline $stable
          "path=$path" >> $env:GITHUB_OUTPUT
          "versioned=$versioned" >> $env:GITHUB_OUTPUT
          "stable=$stable" >> $env:GITHUB_OUTPUT

      - name: Publish the installer to Cloudflare R2
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $v = '${{ needs.build.outputs.version }}'
          $p = '${{ steps.checksums.outputs.path }}'
          # Versioned objects never change, so they can be cached forever.
          # The stable names DO change every release, and an installer cached
          # at the edge alongside a fresh checksum is a hash mismatch that
          # breaks auto-update for everyone until the cache expires.
          $immutable = "public, max-age=31536000, immutable"
          $mutable = "public, max-age=60, must-revalidate"
          npx --yes wrangler@4.123.0 r2 object put "matteshot-downloads/MatteshotSetup-$v.exe" `
            --file $p --content-type application/octet-stream --cache-control $immutable --remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes wrangler@4.123.0 r2 object put "matteshot-downloads/MatteshotSetup.exe" `
            --file $p --content-type application/octet-stream --cache-control $mutable --remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes wrangler@4.123.0 r2 object put "matteshot-downloads/MatteshotSetup-$v.exe.sha256" `
            --file '${{ steps.checksums.outputs.versioned }}' --content-type text/plain --cache-control $immutable --remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes wrangler@4.123.0 r2 object put "matteshot-downloads/MatteshotSetup.exe.sha256" `
            --file '${{ steps.checksums.outputs.stable }}' --content-type text/plain --cache-control $mutable --remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Purge the stable download from the edge
        id: purge
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          # Writing a new object does not evict what the edge already holds.
          # Without this the stable URL keeps serving the PREVIOUS installer
          # next to the new checksum until its TTL expires.
          # Use a separate least-privilege Zone > Cache Purge token. Without
          # it the stable URL still corrects itself once the cached entry
          # expires, so a missing permission is a warning, not a failed
          # release. It does mean the strict check below cannot be enforced.
          $ok = $false
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) {
            Write-Warning "CLOUDFLARE_CACHE_PURGE_API_TOKEN is not set; skipping the edge purge."
          } elseif ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ZONE_ID)) {
            Write-Warning "CLOUDFLARE_ZONE_ID is not set; skipping the edge purge."
          } else {
            $body = @{ files = @(
              "https://download.matteshot.app/MatteshotSetup.exe",
              "https://download.matteshot.app/MatteshotSetup.exe.sha256"
            ) } | ConvertTo-Json
          # Say exactly why a refusal happened. Swallowing the Cloudflare error
          # made a failing purge indistinguishable from a missing permission.
          try {
            $token = Invoke-RestMethod -Method Get `
              -Uri "https://api.cloudflare.com/client/v4/user/tokens/verify" `
              -Headers @{ Authorization = "Bearer $env:CLOUDFLARE_API_TOKEN" }
            Write-Host "Cache purge token status: $($token.result.status)"
          } catch {
            Write-Host "Could not verify the cache purge token: $_"
          }
            try {
              $purge = Invoke-RestMethod -Method Post `
                -Uri "https://api.cloudflare.com/client/v4/zones/$env:CLOUDFLARE_ZONE_ID/purge_cache" `
                -Headers @{ Authorization = "Bearer $env:CLOUDFLARE_API_TOKEN" } `
                -ContentType "application/json" -Body $body
              $ok = [bool]$purge.success
              if (-not $ok) {
                Write-Host "Cloudflare rejected the purge: $($purge.errors | ConvertTo-Json -Compress)"
              }
            } catch {
              $ok = $false
              $detail = $_.ErrorDetails.Message
              if (-not $detail) { $detail = $_.Exception.Message }
              Write-Host "Purge call failed against zone $env:CLOUDFLARE_ZONE_ID : $detail"
            }
            if ($ok) {
              Write-Host "Purged the stable installer and checksum from the edge."
            } else {
              Write-Warning "Cache purge was refused. CLOUDFLARE_CACHE_PURGE_API_TOKEN needs Zone > Cache Purge on zone $env:CLOUDFLARE_ZONE_ID. Uploads set a 60s TTL, so the stable URL still corrects itself shortly; this only removes the wait."
            }
          }
          "purged=$($ok.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Verify published installers
        shell: pwsh
        run: |
          $v = '${{ needs.build.outputs.version }}'
          $expected = '${{ needs.build.outputs.hash }}'
          $versioned = Join-Path $env:RUNNER_TEMP "verify-MatteshotSetup-$v.exe"
          $stable = Join-Path $env:RUNNER_TEMP "verify-MatteshotSetup.exe"
          $nonce = [guid]::NewGuid().ToString("N")

          Invoke-WebRequest `
            -Uri "https://download.matteshot.app/MatteshotSetup-$v.exe?verify=$nonce" `
            -Headers @{ "Cache-Control" = "no-cache"; Pragma = "no-cache" } `
            -OutFile $versioned
          Invoke-WebRequest `
            -Uri "https://download.matteshot.app/MatteshotSetup.exe?verify=$nonce" `
            -Headers @{ "Cache-Control" = "no-cache"; Pragma = "no-cache" } `
            -OutFile $stable

          foreach ($path in @($versioned, $stable)) {
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              Write-Error "Published download verification failed for $path. Expected $expected, got $actual."
              exit 1
            }
          }
          Write-Host "Versioned and stable public installers match SHA-256 $expected."

          # The checks above bypass the edge with a nonce, so they prove the
          # object landed but not what a user receives. Auto-update reads the
          # plain URL and pairs it with the published checksum: if the edge
          # serves a stale installer next to a fresh checksum, every client
          # fails the hash gate. Verify exactly what a client would fetch.
          $plainOk = $false
          foreach ($attempt in 1..10) {
            $plain = Join-Path $env:RUNNER_TEMP "plain-MatteshotSetup.exe"
            $sums = Join-Path $env:RUNNER_TEMP "plain-MatteshotSetup.exe.sha256"
            Invoke-WebRequest -Uri "https://download.matteshot.app/MatteshotSetup.exe" -OutFile $plain
            Invoke-WebRequest -Uri "https://download.matteshot.app/MatteshotSetup.exe.sha256" -OutFile $sums
            $served = (Get-FileHash -Algorithm SHA256 $plain).Hash.ToLowerInvariant()
            $claimed = ((Get-Content -Raw $sums) -split '\s+')[0].ToLowerInvariant()
            if ($served -eq $expected -and $claimed -eq $expected) { $plainOk = $true; break }
            Write-Host "Attempt ${attempt}: edge still serving installer $served / checksum $claimed; waiting."
            Start-Sleep -Seconds 20
          }
          if ($plainOk) {
            Write-Host "Public stable URL and checksum agree on $expected."
          } elseif ('${{ steps.purge.outputs.purged }}' -eq 'true') {
            # The edge was purged and still disagrees, so something is actually
            # wrong rather than merely cached.
            Write-Error "The public stable URL and its checksum never agreed on $expected after a successful purge."
            exit 1
          } else {
            Write-Warning "The stable download URL is still serving an older installer because the edge could not be purged. Versioned URLs and auto-update are unaffected; the stable URL corrects itself when its TTL expires."
          }

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $hash = '${{ needs.build.outputs.hash }}'
          $notes = "Signed Windows installer.`n`nSHA-256: $hash"
          gh release create "v$version" `
            '${{ steps.checksums.outputs.path }}' `
            '${{ steps.checksums.outputs.versioned }}' `
            --title "Matteshot $version" `
            --notes $notes `
            --draft `
            --verify-tag
