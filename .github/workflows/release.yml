name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build and sign first, but do not publish yet: nothing may reach R2 until
  # the exact artifact has passed the same signer-identity gate every
  # installed client enforces, which the probe job below applies to the
  # tagged build rather than to a local copy of it.
  build:
    name: Build and sign
    runs-on: windows-latest
    # Forks inherit this file but not the signing identity or the release
    # environment; skip rather than fail there.
    if: github.repository == 'btsouth/matteshot'
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.installer.outputs.version }}
      installer-name: ${{ steps.installer.outputs.name }}
      hash: ${{ steps.verify.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the ancestry gate below can walk back to main —
          # this same fetch creates origin/main, so the gate needs no later
          # credentialed fetch and the token is not left on the runner.
          fetch-depth: 0
          persist-credentials: false

      # A tag can be pushed onto any commit. Only commits that already merged
      # to protected main may be built and signed as a release. The tag name
      # travels through env, never spliced into script text: git allows quotes
      # and $() in tag names, and an interpolated one would execute here.
      - name: Require a tag on a commit reachable from main
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # origin/main comes from the checkout above. If it is somehow
          # absent, merge-base errors and this gate fails closed.
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tag $env:TAG_NAME points at $env:GITHUB_SHA, which is not reachable from origin/main."
            exit 1
          }

      - name: Validate release version
        id: release
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: .\scripts\validate-release-version.ps1 -Tag $env:TAG_NAME

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify code
        shell: pwsh
        run: .\scripts\verify-code.ps1

      # A no-op on the hosted image, which ships the Azure CLI, and kept as
      # the guard for one that does not: the install is skipped when `az` is
      # already on PATH. When it does run, the directory has to be added to
      # GITHUB_PATH explicitly, because a fresh choco install is invisible to
      # later steps otherwise.
      - name: Install Azure CLI
        shell: pwsh
        run: |
          if (-not (Get-Command az -ErrorAction SilentlyContinue)) {
            # Pinned like every other dependency this credentialed job runs;
            # check-workflow-pins.ps1 rejects an unpinned choco install.
            choco install azure-cli --version=2.89.1 -y --no-progress
          }
          $azDir = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin"
          if (Test-Path $azDir) {
            $azDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Sign in to Azure with GitHub OIDC
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Sign the app exe first so the installer packages a signed binary.
      - name: Sign the app binary with Trusted Signing
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}\target\release\matteshot.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ISCC signs the setup executable and the generated uninstaller through
      # scripts\sign-file.ps1. The uninstaller can only be signed here: it
      # exists solely inside the compiler, and shipping it unsigned meant
      # SmartScreen warnings at uninstall despite a trusted install.
      - name: Build and sign the installer
        id: installer
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          # Pinned: the ISCC path below is version-specific, and Inno Setup 7
          # is already out upstream. An unpinned install breaks this step the
          # day the Chocolatey package moves to it, after the app binary has
          # been signed but before anything is published. 6.7.1 is the newest
          # the Chocolatey feed carries.
          choco install innosetup --version=6.7.1 -y --no-progress
          $version = '${{ steps.release.outputs.version }}'
          $signScript = (Resolve-Path 'scripts\sign-file.ps1').Path
          if ($signScript -match '\s') {
            Write-Error "sign-file.ps1 resolved to a path with whitespace, which the Inno sign command cannot carry unquoted: $signScript"
            exit 1
          }
          # Inno substitutes `$f` with the quoted target path itself; the
          # guard above keeps the script path quote-free, so the command has
          # no embedded-quote layers to survive native argument passing.
          $signCommand = "pwsh -NoProfile -ExecutionPolicy Bypass -File $signScript `$f"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$version /DSign "/Ssigntool=$signCommand" installer\matteshot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $path = "installer\Output\MatteshotSetup-$version.exe"
          if (-not (Test-Path $path)) { Write-Error "installer not found at $path"; exit 1 }
          "path=$((Resolve-Path $path).Path)" >> $env:GITHUB_OUTPUT
          "name=$(Split-Path -Leaf $path)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify signatures and checksum
        id: verify
        shell: pwsh
        run: |
          # Assert the exact signer, not just generic validity: the installed
          # app's own updater gate (src/installer.rs) accepts only this
          # identity, so a merely-Valid signature from a drifted profile would
          # pass Windows and still brick auto-update for every client.
          foreach ($file in @(
            '${{ github.workspace }}\target\release\matteshot.exe',
            '${{ steps.installer.outputs.path }}'
          )) {
            $sig = Get-AuthenticodeSignature $file
            $sig | Format-List Status, StatusMessage, SignerCertificate
            if ($sig.Status -ne 'Valid') {
              Write-Error "Signature on $file is $($sig.Status)."
              exit 1
            }
            $signer = $sig.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($signer -cne 'Brandon South') {
              Write-Error "Unexpected signer on ${file}: '$signer' ($($sig.SignerCertificate.Subject))"
              exit 1
            }
          }
          $hash = (Get-FileHash -Algorithm SHA256 '${{ steps.installer.outputs.path }}').Hash.ToLowerInvariant()
          "hash=$hash" >> $env:GITHUB_OUTPUT
          # Travels inside the artifact so the probe and publish jobs verify
          # the exact bytes this job hashed, on their own machines.
          "$hash  MatteshotSetup-${{ steps.installer.outputs.version }}.exe" |
            Set-Content -Encoding ascii -NoNewline 'installer\Output\MatteshotSetup.exe.sha256'
          Write-Host "SHA-256: $hash"

      - name: Upload unverified release for probing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-unverified-${{ steps.installer.outputs.version }}
          path: |
            target\release\matteshot.exe
            installer\Output\${{ steps.installer.outputs.name }}
            installer\Output\MatteshotSetup.exe.sha256
          if-no-files-found: error
          retention-days: 1

  # The strict probe suite includes the updater's own --verify-signature-test
  # gate (accept ours, reject tampered, reject foreign), run against the exact
  # tagged artifact rather than against the build job's own copy of it. It
  # also needs a real desktop session for --record-test to encode from, which
  # is why it cannot fold back into a runner without one. Publishing an
  # installer every installed client would reject is the failure this buys
  # against.
  probe:
    name: Probe the tagged release
    needs: build
    runs-on: windows-latest
    # Forks inherit this file but not the signing identity or the release
    # environment; skip rather than fail there.
    if: github.repository == 'btsouth/matteshot'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download unverified release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-unverified-${{ needs.build.outputs.version }}

      - name: Re-verify signature and hash after transfer
        shell: pwsh
        run: |
          $installerPath = "installer\Output\${{ needs.build.outputs.installer-name }}"
          foreach ($file in @('target\release\matteshot.exe', $installerPath)) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid') {
              Write-Error "Signature on $file is $($sig.Status) after transfer."
              exit 1
            }
            $signer = $sig.SignerCertificate.GetNameInfo(
              [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($signer -cne 'Brandon South') {
              Write-Error "Unexpected signer on ${file}: '$signer' ($($sig.SignerCertificate.Subject))"
              exit 1
            }
          }
          $actual = (Get-FileHash -Algorithm SHA256 $installerPath).Hash.ToLowerInvariant()
          if ($actual -ne '${{ needs.build.outputs.hash }}') {
            Write-Error "Installer hash changed after transfer. Expected ${{ needs.build.outputs.hash }}, got $actual."
            exit 1
          }

      # The probes skip capture on hosted runners because nothing is on screen
      # by default, which is how a build that captured fine and then crashed on
      # exit got as far as a signed 0.21.0 candidate (#136). Put a window up
      # and hold the capture path and the exit code to account.
      - name: Capture a window with the signed build
        shell: pwsh
        run: |
          Start-Process cmd.exe -ArgumentList '/k title Matteshot-Probe && dir %SystemRoot%'
          Start-Sleep -Seconds 3
          $log = Join-Path $env:RUNNER_TEMP 'bench.log'
          $p = Start-Process 'target\release\matteshot.exe' `
            -ArgumentList '--bench', 'Matteshot-Probe' `
            -RedirectStandardError $log -NoNewWindow -Wait -PassThru
          Get-Content $log
          if ($p.ExitCode -ne 0) {
            Write-Error ("--bench exited with 0x{0:X8}" -f $p.ExitCode)
            exit 1
          }
          if (-not (Select-String -Path $log -Pattern 'bench 3:' -Quiet)) {
            Write-Error 'The capture did not complete three rounds.'
            exit 1
          }

      - name: Record a video fixture
        shell: pwsh
        run: |
          & '${{ github.workspace }}\target\release\matteshot.exe' --record-test 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probe the tagged release
        shell: pwsh
        # -Offline: the network probes check the *published* release, which
        # this run has deliberately not published yet. -NoCapture because a
        # GitHub-hosted runner has no visible window. -Strict so a probe that
        # silently did not run fails the release instead of shipping.
        run: |
          .\scripts\run-probes.ps1 `
            -Strict `
            -Offline `
            -NoCapture `
            -Exe '${{ github.workspace }}\target\release\matteshot.exe' `
            -SignedFile '${{ github.workspace }}\installer\Output\${{ needs.build.outputs.installer-name }}'

  # Publishes only after the probe job passed, and only bytes whose SHA-256
  # matches what the build job hashed and the probe job tested.
  publish:
    name: Publish
    needs: [build, probe]
    runs-on: windows-latest
    # Forks inherit this file but not the signing identity or the release
    # environment; skip rather than fail there.
    if: github.repository == 'btsouth/matteshot'
    environment: release
    # Deliberately loose. This job downloads the probed installer, re-verifies
    # it, pushes four objects to R2 through a `npx --yes wrangler` that fetches
    # the package each time, then purges the edge with retries. A ceiling tight
    # enough to save minutes here is tight enough to abandon a release
    # half-published, which costs far more than the minutes do.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gh release create authenticates through GH_TOKEN env, not git.
          persist-credentials: false

      - name: Require Python 3 and OpenSSL 3
        shell: pwsh
        run: |
          # Hosted windows-latest ships Git's OpenSSL 3 and the py launcher.
          # The signer needs pkeyutl -rawin (OpenSSL 3 only). Probe that, and
          # never invoke the WindowsApps python stub, which hangs.
          $openssl = $null
          foreach ($candidate in @(
            "$env:ProgramFiles\Git\usr\bin\openssl.exe",
            "${env:ProgramFiles(x86)}\Git\usr\bin\openssl.exe",
            "$env:ProgramFiles\OpenSSL-Win64\bin\openssl.exe"
          )) {
            if (-not (Test-Path $candidate)) { continue }
            $help = & $candidate pkeyutl -help 2>&1 | Out-String
            if ($help -match '-rawin') {
              $openssl = $candidate
              break
            }
          }
          if (-not $openssl) {
            $onPath = Get-Command openssl -ErrorAction SilentlyContinue |
              Where-Object { $_.Source -notmatch 'WindowsApps' } |
              Select-Object -First 1
            if ($onPath) {
              $help = & $onPath.Source pkeyutl -help 2>&1 | Out-String
              if ($help -match '-rawin') { $openssl = $onPath.Source }
            }
          }
          if (-not $openssl) {
            Write-Error "OpenSSL 3 with pkeyutl -rawin is required to sign a release record. Install Git for Windows so usr\bin\openssl.exe is present."
            exit 1
          }

          function Resolve-PythonExe {
            $py = Get-Command py -ErrorAction SilentlyContinue |
              Where-Object { $_.Source -notmatch 'WindowsApps' } |
              Select-Object -First 1
            if ($py) {
              $exe = & $py.Source -3 -c "import sys; print(sys.executable)" 2>$null
              if ($LASTEXITCODE -eq 0 -and $exe) {
                $exe = [string]$exe
                if ($exe -match '[\r\n]') {
                  $exe = ($exe -split '[\r\n]+' | Where-Object { $_ } | Select-Object -Last 1)
                }
                $exe = $exe.Trim()
                if ($exe -and (Test-Path $exe) -and $exe -notmatch 'WindowsApps') {
                  return $exe
                }
              }
            }
            foreach ($name in @('python3', 'python')) {
              $cmd = Get-Command $name -ErrorAction SilentlyContinue |
                Where-Object { $_.Source -notmatch 'WindowsApps' } |
                Select-Object -First 1
              if (-not $cmd) { continue }
              & $cmd.Source -c "import sys; raise SystemExit(0 if sys.version_info -ge (3, 9) else 1)" 2>$null
              if ($LASTEXITCODE -eq 0) { return $cmd.Source }
            }
            if ($env:RUNNER_TOOL_CACHE) {
              $found = Get-ChildItem -Path (Join-Path $env:RUNNER_TOOL_CACHE 'Python') -Recurse -Filter python.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -notmatch 'WindowsApps' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if ($found) { return $found.FullName }
            }
            return $null
          }

          $python = Resolve-PythonExe
          if (-not $python) {
            Write-Error "Python 3 is required to sign the release record. Hosted windows-latest should provide the py launcher; WindowsApps stubs are ignored."
            exit 1
          }

          "OPENSSL_BIN=$openssl" >> $env:GITHUB_ENV
          "PYTHON_EXE=$python" >> $env:GITHUB_ENV
          Write-Host "OpenSSL: $openssl"
          Write-Host "Python: $python"
          & $openssl version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -c "import sys; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Require release credentials
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MATTESHOT_RELEASE_SIGNING_KEY: ${{ secrets.MATTESHOT_RELEASE_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) {
            Write-Error "CLOUDFLARE_R2_API_TOKEN is required for releases."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            Write-Error "CLOUDFLARE_ACCOUNT_ID is required for releases."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:MATTESHOT_RELEASE_SIGNING_KEY)) {
            Write-Error "MATTESHOT_RELEASE_SIGNING_KEY is required. New clients refuse an unsigned installer (SBS-747)."
            exit 1
          }
          $headers = @{
            Authorization = "Bearer $env:CLOUDFLARE_API_TOKEN"
          }
          $uri = "https://api.cloudflare.com/client/v4/accounts/$env:CLOUDFLARE_ACCOUNT_ID/tokens/verify"
          $token = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          if (-not $token.success -or $token.result.status -ne "active") {
            Write-Error "The Cloudflare release token is not active."
            exit 1
          }

      - name: Download probed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-unverified-${{ needs.build.outputs.version }}

      - name: Verify the probed bytes and stage checksums
        id: checksums
        shell: pwsh
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $expected = '${{ needs.build.outputs.hash }}'
          $path = (Resolve-Path "installer\Output\${{ needs.build.outputs.installer-name }}").Path
          $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            Write-Error "Installer hash changed between probing and publication. Expected $expected, got $actual."
            exit 1
          }
          $versioned = Join-Path $env:RUNNER_TEMP "MatteshotSetup-$version.exe.sha256"
          $stable = Join-Path $env:RUNNER_TEMP "MatteshotSetup.exe.sha256"
          "$expected  MatteshotSetup-$version.exe" | Set-Content -Encoding ascii -NoNewline $versioned
          "$expected  MatteshotSetup.exe" | Set-Content -Encoding ascii -NoNewline $stable
          $length = (Get-Item $path).Length
          "path=$path" >> $env:GITHUB_OUTPUT
          "versioned=$versioned" >> $env:GITHUB_OUTPUT
          "stable=$stable" >> $env:GITHUB_OUTPUT
          "length=$length" >> $env:GITHUB_OUTPUT

      - name: Sign the release record
        id: signed
        shell: pwsh
        env:
          MATTESHOT_RELEASE_SIGNING_KEY: ${{ secrets.MATTESHOT_RELEASE_SIGNING_KEY }}
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $hash = '${{ needs.build.outputs.hash }}'
          $length = '${{ steps.checksums.outputs.length }}'
          $url = "https://download.matteshot.app/MatteshotSetup-$version.exe"
          $python = $env:PYTHON_EXE
          if (-not $python -or -not (Test-Path $python)) {
            Write-Error "PYTHON_EXE was not resolved."
            exit 1
          }
          $versioned = Join-Path $env:RUNNER_TEMP "MatteshotSetup-$version.exe.release.json"
          $stable = Join-Path $env:RUNNER_TEMP "MatteshotSetup.exe.release.json"
          & $python scripts/sign-release-manifest.py `
            --version $version `
            --url $url `
            --length $length `
            --sha256 $hash `
            --key-id 2026.1 `
            --output $versioned
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The signer already checked the seed against the embedded 2026.1
          # public key. Verify the written file again so a swapped output
          # cannot publish, and require the 64-byte signature length.
          & $python scripts/sign-release-manifest.py `
            --verify $versioned `
            --expect-version $version `
            --expect-url $url `
            --expect-length $length `
            --expect-sha256 $hash `
            --expect-key-id 2026.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The stable installer is the same bytes. The signed URL stays the
          # immutable versioned name; clients that download the stable name
          # still fetch this record from the versioned URL in version.json.
          Copy-Item $versioned $stable
          $doc = Get-Content -Raw $versioned | ConvertFrom-Json
          if ($doc.sha256 -cne $hash -or $doc.version -cne $version -or $doc.url -cne $url) {
            Write-Error "Signed release record does not bind this installer."
            exit 1
          }
          if ([int64]$doc.length -ne [int64]$length) {
            Write-Error "Signed release length $($doc.length) does not match installer $length."
            exit 1
          }
          try {
            $sig = [Convert]::FromBase64String([string]$doc.signature)
          } catch {
            Write-Error "Signed release signature is not standard base64."
            exit 1
          }
          if ($sig.Length -ne 64) {
            Write-Error "Signed release signature is $($sig.Length) bytes, expected 64."
            exit 1
          }
          "versioned=$versioned" >> $env:GITHUB_OUTPUT
          "stable=$stable" >> $env:GITHUB_OUTPUT
          Write-Host "Signed and verified release record for $url ($length bytes, $hash)"

      - name: Publish the installer to Cloudflare R2
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $v = '${{ needs.build.outputs.version }}'
          $p = '${{ steps.checksums.outputs.path }}'
          # Versioned objects never change, so they can be cached forever.
          # The stable names DO change every release. Do not store them in
          # shared or browser caches, where a stale installer beside a fresh
          # checksum would break auto-update until the cache expires.
          $immutable = "public, max-age=31536000, immutable"
          $mutable = "no-store"
          npx --yes wrangler@4.141.0 r2 object put "matteshot-downloads/MatteshotSetup-$v.exe" `
            --file $p --content-type application/octet-stream --cache-control $immutable --remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes wrangler@4.141.0 r2 object put "matteshot-downloads/MatteshotSetup.exe" `
            --file $p --content-type application/octet-stream --cache-control $mutable --remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes wrangler@4.141.0 r2 object put "matteshot-downloads/MatteshotSetup-$v.exe.sha256" `
            --file '${{ steps.checksums.outputs.versioned }}' --content-type text/plain --cache-control $immutable --remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes wrangler@4.141.0 r2 object put "matteshot-downloads/MatteshotSetup.exe.sha256" `
            --file '${{ steps.checksums.outputs.stable }}' --content-type text/plain --cache-control $mutable --remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes wrangler@4.141.0 r2 object put "matteshot-downloads/MatteshotSetup-$v.exe.release.json" `
            --file '${{ steps.signed.outputs.versioned }}' --content-type application/json --cache-control $immutable --remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes wrangler@4.141.0 r2 object put "matteshot-downloads/MatteshotSetup.exe.release.json" `
            --file '${{ steps.signed.outputs.stable }}' --content-type application/json --cache-control $mutable --remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Purge the stable download from the edge
        id: purge
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          # Writing a new object does not evict what the edge already holds.
          # Without this the stable URL keeps serving the PREVIOUS installer
          # next to the new checksum until its TTL expires.
          # Use a separate least-privilege Zone > Cache Purge token. Without
          # it the stable URL still corrects itself once the cached entry
          # expires, so a missing permission is a warning, not a failed
          # release. It does mean the strict check below cannot be enforced.
          $ok = $false
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) {
            Write-Warning "CLOUDFLARE_CACHE_PURGE_API_TOKEN is not set; skipping the edge purge."
          } elseif ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ZONE_ID)) {
            Write-Warning "CLOUDFLARE_ZONE_ID is not set; skipping the edge purge."
          } else {
            $body = @{ files = @(
              "https://download.matteshot.app/MatteshotSetup.exe",
              "https://download.matteshot.app/MatteshotSetup.exe.sha256",
              "https://download.matteshot.app/MatteshotSetup.exe.release.json"
            ) } | ConvertTo-Json
          # Say exactly why a refusal happened. Swallowing the Cloudflare error
          # made a failing purge indistinguishable from a missing permission.
          try {
            $token = Invoke-RestMethod -Method Get `
              -Uri "https://api.cloudflare.com/client/v4/user/tokens/verify" `
              -Headers @{ Authorization = "Bearer $env:CLOUDFLARE_API_TOKEN" }
            Write-Host "Cache purge token status: $($token.result.status)"
          } catch {
            Write-Host "Could not verify the cache purge token: $_"
          }
            try {
              $purge = Invoke-RestMethod -Method Post `
                -Uri "https://api.cloudflare.com/client/v4/zones/$env:CLOUDFLARE_ZONE_ID/purge_cache" `
                -Headers @{ Authorization = "Bearer $env:CLOUDFLARE_API_TOKEN" } `
                -ContentType "application/json" -Body $body
              $ok = [bool]$purge.success
              if (-not $ok) {
                Write-Host "Cloudflare rejected the purge: $($purge.errors | ConvertTo-Json -Compress)"
              }
            } catch {
              $ok = $false
              $detail = $_.ErrorDetails.Message
              if (-not $detail) { $detail = $_.Exception.Message }
              Write-Host "Purge call failed against zone $env:CLOUDFLARE_ZONE_ID : $detail"
            }
            if ($ok) {
              Write-Host "Purged the stable installer and checksum from the edge."
            } else {
              Write-Warning "Cache purge was refused. CLOUDFLARE_CACHE_PURGE_API_TOKEN needs Zone > Cache Purge on zone $env:CLOUDFLARE_ZONE_ID. Stable aliases are no-store, so this only affects copies cached before that policy took effect."
            }
          }
          "purged=$($ok.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Verify published installers
        shell: pwsh
        run: |
          $v = '${{ needs.build.outputs.version }}'
          $expected = '${{ needs.build.outputs.hash }}'
          $versioned = Join-Path $env:RUNNER_TEMP "verify-MatteshotSetup-$v.exe"
          $stable = Join-Path $env:RUNNER_TEMP "verify-MatteshotSetup.exe"
          $nonce = [guid]::NewGuid().ToString("N")

          Invoke-WebRequest `
            -Uri "https://download.matteshot.app/MatteshotSetup-$v.exe?verify=$nonce" `
            -Headers @{ "Cache-Control" = "no-cache"; Pragma = "no-cache" } `
            -OutFile $versioned
          Invoke-WebRequest `
            -Uri "https://download.matteshot.app/MatteshotSetup.exe?verify=$nonce" `
            -Headers @{ "Cache-Control" = "no-cache"; Pragma = "no-cache" } `
            -OutFile $stable

          foreach ($path in @($versioned, $stable)) {
            $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              Write-Error "Published download verification failed for $path. Expected $expected, got $actual."
              exit 1
            }
          }
          Write-Host "Versioned and stable public installers match SHA-256 $expected."

          $manifest = Join-Path $env:RUNNER_TEMP "verify-MatteshotSetup-$v.exe.release.json"
          Invoke-WebRequest `
            -Uri "https://download.matteshot.app/MatteshotSetup-$v.exe.release.json?verify=$nonce" `
            -Headers @{ "Cache-Control" = "no-cache"; Pragma = "no-cache" } `
            -OutFile $manifest
          $python = $env:PYTHON_EXE
          if (-not $python -or -not (Test-Path $python)) {
            Write-Error "PYTHON_EXE was not resolved."
            exit 1
          }
          $publishedLength = (Get-Item $versioned).Length
          & $python scripts/sign-release-manifest.py `
            --verify $manifest `
            --expect-version $v `
            --expect-url "https://download.matteshot.app/MatteshotSetup-$v.exe" `
            --expect-length $publishedLength `
            --expect-sha256 $expected `
            --expect-key-id 2026.1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Published release record did not verify against the embedded 2026.1 public key."
            exit 1
          }
          Write-Host "Published MatteshotSetup-$v.exe.release.json verified against key 2026.1."

          # The checks above bypass the edge with a nonce, so they prove the
          # object landed but not what a user receives. Auto-update reads the
          # plain URL and pairs it with the published checksum: if the edge
          # serves a stale installer next to a fresh checksum, every client
          # fails the hash gate. Verify exactly what a client would fetch.
          $plainOk = $false
          foreach ($attempt in 1..10) {
            $plain = Join-Path $env:RUNNER_TEMP "plain-MatteshotSetup.exe"
            $sums = Join-Path $env:RUNNER_TEMP "plain-MatteshotSetup.exe.sha256"
            Invoke-WebRequest -Uri "https://download.matteshot.app/MatteshotSetup.exe" -OutFile $plain
            Invoke-WebRequest -Uri "https://download.matteshot.app/MatteshotSetup.exe.sha256" -OutFile $sums
            $served = (Get-FileHash -Algorithm SHA256 $plain).Hash.ToLowerInvariant()
            $claimed = ((Get-Content -Raw $sums) -split '\s+')[0].ToLowerInvariant()
            if ($served -eq $expected -and $claimed -eq $expected) { $plainOk = $true; break }
            Write-Host "Attempt ${attempt}: edge still serving installer $served / checksum $claimed; waiting."
            Start-Sleep -Seconds 20
          }
          if ($plainOk) {
            Write-Host "Public stable URL and checksum agree on $expected."
          } elseif ('${{ steps.purge.outputs.purged }}' -eq 'true') {
            # The edge was purged and still disagrees, so something is actually
            # wrong rather than merely cached.
            Write-Error "The public stable URL and its checksum never agreed on $expected after a successful purge."
            exit 1
          } else {
            Write-Warning "The stable download URL is still serving an older installer because the edge could not be purged. Versioned URLs and auto-update are unaffected; only a copy cached before stable aliases became no-store can remain."
          }

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $hash = '${{ needs.build.outputs.hash }}'
          $notes = "Signed Windows installer.`n`nSHA-256: $hash"
          gh release create "v$version" `
            '${{ steps.checksums.outputs.path }}' `
            '${{ steps.checksums.outputs.versioned }}' `
            '${{ steps.signed.outputs.versioned }}' `
            --title "Matteshot $version" `
            --notes $notes `
            --draft `
            --verify-tag
