# cargo-deny policy, checked in CI by the "Dependency policy" job.
# RustSec advisories are also gated on Windows by scripts/audit-rust.ps1.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[licenses]
# Every dependency must be usable in a MIT OR Apache-2.0 application.
# MPL-2.0 is file-level copyleft (option-ext, through dirs) and fine to link.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
ignore = []
