[package]
name = "matteshot"
version = "0.9.3"
edition = "2021"
description = "Every screenshot, a matte shot. PrtScn -> six styled mattes -> pick one -> premium PNG on your clipboard."

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
chrono = "0.4"
dirs = "5"
sha2 = "0.10"
winreg = "0.52"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
rayon = "1"

[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_Networking_WinHttp",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
]

[profile.release]
lto = true
strip = true

[build-dependencies]
winres = "0.1"
